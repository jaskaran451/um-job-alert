name: UM Job Alert - Manual Fallback

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: um-job-alert-manual
  cancel-in-progress: false

jobs:
  check-postings:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Inspect the public recruitment portal
        env:
          BROWSER_CHANNEL: chrome
          MAX_ALERT_AGE_DAYS: "14"
        run: python um_job_alert.py

      - name: Save detected jobs and pending delivery state
        run: |
          if git diff --quiet -- data/seen_jobs.json; then
            echo "Posting state is unchanged."
            exit 0
          fi
          git config user.name "um-job-alert[bot]"
          git config user.email "um-job-alert[bot]@users.noreply.github.com"
          git add data/seen_jobs.json
          git commit -m "Update UM job history [skip ci]"
          git push

      - name: Dispatch pending jobs to Telegram subscribers
        env:
          SUBSCRIBER_API_URL: ${{ vars.SUBSCRIBER_API_URL }}
          SUBSCRIBER_API_KEY: ${{ secrets.SUBSCRIBER_API_KEY }}
          SUBSCRIBER_API_TIMEOUT_SECONDS: "120"
        run: python dispatch_subscribers.py --state-file data/seen_jobs.json

      - name: Save successful delivery state
        if: ${{ success() }}
        run: |
          if git diff --quiet -- data/seen_jobs.json; then
            echo "Delivery state is unchanged."
            exit 0
          fi
          git config user.name "um-job-alert[bot]"
          git config user.email "um-job-alert[bot]@users.noreply.github.com"
          git add data/seen_jobs.json
          git commit -m "Mark UM job alerts delivered [skip ci]"
          git push
